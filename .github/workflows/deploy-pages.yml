name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "fpv-simulation/**"
      - ".github/pages-requirements.txt"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v6

      - name: Check out folio_gen
        uses: actions/checkout@v6
        with:
          repository: aashizpoudel/folio_gen
          path: folio_gen

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/pages-requirements.txt

      - name: Install generator dependencies
        run: python -m pip install --requirement .github/pages-requirements.txt

      - name: Generate portfolio
        run: python folio_gen/generate.py content _site

      - name: Add standalone FPV simulation
        run: |
          cp -a fpv-simulation _site/fpv-simulation
          touch _site/.nojekyll

      - name: Validate generated site
        run: |
          test -s _site/index.html
          test -s _site/projects/index.html
          test -s _site/publications/index.html
          test -s _site/today-i-learned/index.html
          test -s _site/static/css/style.css
          test -s _site/fpv-simulation/index.html
          test -z "$(find _site -type l -print -quit)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
